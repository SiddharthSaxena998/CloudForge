# CloudForge gateway: ONE address for dashboard + API + live WebSocket.
# Browser -> (Cloudflare Tunnel) -> this nginx -> frontend-public:8080 | backend:5000
# Docker's own DNS (127.0.0.11) is re-asked every few seconds so a restarted container is found again.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Real visitor IP for the backend's rate limits (Cloudflare sends it in CF-Connecting-IP)
map $http_cf_connecting_ip $client_ip {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}

server {
  listen 80;
  server_name _;

  # a bit above MAX_UPLOAD_MB (100) so the backend can answer with its own, friendlier error
  client_max_body_size 110m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $client_ip;
  proxy_set_header X-Forwarded-For   $client_ip;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  location /api/ {
    set $backend http://backend:5000;
    proxy_pass $backend;
    proxy_read_timeout 300s;      # uploads / git clone can take a while
    proxy_request_buffering off;  # stream big uploads instead of buffering them in nginx
  }

  location /socket.io/ {
    set $backend http://backend:5000;
    proxy_pass $backend;
    proxy_read_timeout 3600s;     # keep WebSockets (live logs / metrics) open
    proxy_send_timeout 3600s;
  }

  location / {
    set $frontend http://frontend-public:8080;
    proxy_pass $frontend;
    proxy_read_timeout 300s;
  }
}
